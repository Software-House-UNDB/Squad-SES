services:
  postgres:
    image: postgres:16-alpine
    container_name: ses_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ses_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: ses_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cria bucket padrão na primeira subida; sai depois de rodar
  minio-setup:
    image: cgr.dev/chainguard/minio-client:latest
    container_name: ses_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    # A imagem Chainguard nao tem /bin/sh: alias via MC_HOST_local e mc direto no entrypoint
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    entrypoint: ["mc", "mb", "--ignore-existing", "local/ses-docs"]

volumes:
  postgres_data:
  minio_data:
