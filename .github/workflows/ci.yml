name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detectar mudanças
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (lint + build + test)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install (root workspace)
        run: npm ci

      # Prisma steps: só rodam depois que Prisma for adicionado ao backend
      - name: Prisma generate
        run: npm run prisma:generate --workspace=backend --if-present

      - name: Lint
        run: npm run lint --workspace=backend

      - name: Build
        run: npm run build --workspace=backend

      - name: Unit tests
        run: npm run test --workspace=backend

  backend-integracao:
    name: Backend (integração com Postgres)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    # Banco descartável só deste job: os testes gravam e não apagam nada
    # (a auditoria é append-only).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ses_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ses_teste
      DATABASE_URL_TESTE: postgresql://postgres:postgres@localhost:5432/ses_teste

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install (root workspace)
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate --workspace=backend

      # Aplica as migrations como o deploy do Render: também testa que elas
      # sobem do zero num Postgres 16 limpo.
      - name: Migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Testes de integração
        run: npm run test:e2e --workspace=backend

  frontend:
    name: Frontend (lint + build + test)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install (root workspace)
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=frontend

      - name: Type check
        run: npm run typecheck --workspace=frontend --if-present

      - name: Build
        run: npm run build --workspace=frontend

      - name: Unit tests
        run: npm run test --workspace=frontend --if-present

  ci-ok:
    name: CI OK
    needs: [changes, backend, backend-integracao, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verifica resultado dos jobs
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Job 'changes' falhou: ${{ needs.changes.result }}"; exit 1
          fi
          for result in "${{ needs.backend.result }}" "${{ needs.backend-integracao.result }}" "${{ needs.frontend.result }}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "Algum job de build/test falhou: $result"; exit 1
            fi
          done
          echo "OK"
